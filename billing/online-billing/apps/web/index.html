<!doctype html>
<html>
  <head>
    <title>SCIPSI Online Billing</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="SCIPSI Online Billing Portal — manage invoices, payments, and account services securely online."
    />
    <!-- PWA manifest and theme (P1-11 / W33) -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#1a56db" />
    <!-- Favicon -->
    <link rel="shortcut icon" type="image/x-icon" href="src/assets/images/favicon.ico" />
    <!-- Apple PWA support (optional install, non-authoritative) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="SCIPSI Billing" />
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png" />

    <style>
      /* 防止页面刷新时白屏的初始样式 */
      html {
        background-color: #fafbfc;
      }

      html.dark {
        background-color: #070707;
      }
    </style>

    <script>
      // 初始化 html class 主题属性
      ;(function () {
        try {
          if (typeof Storage === 'undefined' || !window.localStorage) {
            return
          }

          const themeType = localStorage.getItem('sys-theme')
          if (themeType === 'dark') {
            document.documentElement.classList.add('dark')
          }
        } catch (e) {
          console.warn('Failed to apply initial theme:', e)
        }
      })()
    </script>
  </head>

  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
