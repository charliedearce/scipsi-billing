; Encrypt TDS. SQL Server Express presents a self-signed certificate whose
; name never matches host.docker.internal, so CA/hostname verification is off.
; Equivalent to Encrypt=true;TrustServerCertificate=true. Keep SQL Server on
; a private network; do not expose it to the public internet.
[global]
    tds version = auto
    client charset = UTF-8
    connect timeout = 10
    timeout = 120
    encryption = require
    check certificate hostname = no
    text size = 2147483647
